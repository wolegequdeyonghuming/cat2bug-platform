# 开发环境配置
server:
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json
    min-response-size: 1024

swagger:
  enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

logging:
  level:
    com.cat2bug: debug
    org.springframework: warn
