include:
  - project: 'cidevops/cidevops-gitlabci-service'
    ref: master
    file: 'templates/maven-pipeline.yml'

variables:
  ## 项目信息（项目名 cat2bug）
  APP_NAME: "cat2bug"
  MODULE_NAME: "backend"
  CONTAINER_PORT: "8000"

  ## 作业控制：构建 + 镜像 + K8s 部署
  RUN_PIPELINE_BUILD: "yes"
  RUN_PIPELINE_TEST:  "no"
  RUN_BUILD_IMAGE:    "yes"
  RUN_DEPLOY_K8S:     "yes"
  NEED_INGRESS:       "yes"

  ## 镜像名使用本项目自带容器仓库路径（模板硬编码 /deshui/，本项目不适用）
  # IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_PIPELINE_ID"

  ## 依赖镜像（含 JDK17 + Maven；Node 在 build.before_script 安装）
  BUILD_IMAGE: "maven:3.9-eclipse-temurin-17"
  MAVEN_CLI_OPTS: "-T 1C -U --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

build:
  image: $BUILD_IMAGE
  extends: .build
  before_script:
    # Maven 镜像不含 Node，安装 Node 20 + pnpm
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y --no-install-recommends nodejs
    - npm config set registry https://registry.npmmirror.com/
    - npm install -g pnpm@10.25.0
    - node --version && pnpm --version
  variables:
    # 1) 前端 embedded 打包（产物写入 admin/src/main/resources/static）
    # 2) Maven 打包
    BUILD_SHELL: "cd cat2bug-platform-ui && pnpm install --frozen-lockfile && cd .. \
      && bash deploy/scripts/ui-build.sh embedded \
      && mvn $MAVEN_OPTS $MAVEN_CLI_OPTS -pl cat2bug-platform-admin -am package -DskipTests -s $$MAVEN_SETTING"
  cache:
    key: "$CI_COMMIT_REF_SLUG-v3"
    paths:
      - "**/target/*.jar"
      - "cat2bug-platform-ui/node_modules/"
  artifacts:
    name: "${APP_NAME}-admin"
    paths:
      - cat2bug-platform-admin/target/cat2bug-admin.jar
    expire_in: 1 week

## 覆盖模板的 K8s 部署：使用本项目自定义清单
## 通过 PVC 持久化 config（install 文件）、uploadPath（附件）、data、logs
.deploy_cat2bug:
  image: $KUBECTL_IMAGE
  cache: []
  script:
    - mkdir -p ~/.kube && cp "$KUBECONFIG" ~/.kube/config && chmod 600 ~/.kube/config
    - kubectl get ns "$KUBE_NAMESPACE" || kubectl create ns "$KUBE_NAMESPACE"
    - kubectl -n "$KUBE_NAMESPACE" create secret docker-registry cat2bug-registry --docker-server="$CI_REGISTRY" --docker-username="$CI_REGISTRY_USER" --docker-password="$CI_REGISTRY_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - for f in pvc service deployment; do sed -e "s#__NAMESPACE__#$KUBE_NAMESPACE#g" -e "s#__IMAGE__#$IMAGE_NAME#g" "deploy/k8s/$f.yaml" | kubectl apply -f -; done
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/cat2bug --timeout=180s

deploy_feature:
  extends: .deploy_cat2bug
  stage: deploy-feature
  needs: [build_image]
  variables:
    KUBE_NAMESPACE: "dev-cat2bug-default"
  environment:
    # 必须与模板 rollout_feature 的 environment.name 完全一致
    name: "${ENV_NAME}/${VERSION_NAME}/${MODULE_NAME}"
  rules:
    - if: '$RUN_DEPLOY_K8S == "no"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME =~ /.*-dev/'
      when: on_success
    - when: never

## 本项目仅使用 dev 环境：禁用 stage 部署
## （避免与模板 rollout_stag 的环境名校验冲突；如需 stage 再恢复为完整部署）
deploy_stag:
  stage: deploy-stag
  image: $KUBECTL_IMAGE
  cache: []
  environment:
    name: "${ENV_NAME}/${VERSION_NAME}/${MODULE_NAME}"
  script:
    - echo "stage 环境已禁用（本项目仅使用 dev）"
  rules:
    - when: never

## 与模板 rollout_stag 环境名保持一致并禁用，避免误推 prod 分支时的 needs/on_stop 校验问题
rollout_stag:
  stage: rollout-stag
  image: $KUBECTL_IMAGE
  cache: []
  environment:
    name: "${ENV_NAME}/${VERSION_NAME}/${MODULE_NAME}"
    action: stop
  script:
    - echo "stage rollback 已禁用（本项目仅使用 dev）"
  rules:
    - when: never
